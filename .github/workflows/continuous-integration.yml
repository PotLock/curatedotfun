name: CI
on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: continuous-integration.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prettier:
    timeout-minutes: 60
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run prettier
        run: pnpm run fmt:check
